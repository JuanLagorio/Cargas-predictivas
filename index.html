  <!-- INGRESO -->
  <section id="pantalla-ingreso" class="ingreso" hidden>
    <form class="ingreso-card" id="form-ingreso" autocomplete="on">
      <img src="icons/icon-192.png" alt="Doña Sol" class="ingreso-logo" width="84" height="84" />
      <h1>Cargas de reparto</h1>
      <p class="ingreso-sub">Salida, recarga, vuelta y control con facturación.</p>
      <label class="campo">
        <span>Email</span>
        <input type="email" id="ingreso-email" required autocomplete="username" />
      </label>
      <label class="campo">
        <span>Contraseña</span>
        <input type="password" id="ingreso-clave" required autocomplete="current-password" />
      </label>
      <p class="ingreso-error" id="ingreso-error" role="alert"></p>
      <button type="submit" class="btn btn-primario btn-ancho" id="btn-ingresar">Ingresar</button>
      <button type="button" class="btn btn-link" id="btn-prueba">Probar con datos de ejemplo</button>
      <p class="ingreso-nota">Se usa la misma cuenta que el panel de administración de la web.</p>
    </form>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <header class="barra">
      <div class="barra-in">
        <a href="#/" class="marca" aria-label="Inicio">
          <img src="icons/icon-192.png" alt="" width="36" height="36" />
          <span>Cargas</span>
        </a>
        <nav class="nav" id="nav" aria-label="Secciones">
          <a href="#/" data-ruta="hoy"><svg class="ico"><use href="#i-hoy"/></svg><span>Hoy</span></a>
          <a href="#/panel" data-ruta="panel"><svg class="ico"><use href="#i-panel"/></svg><span>Panel</span></a>
          <a href="#/historial" data-ruta="historial"><svg class="ico"><use href="#i-historial"/></svg><span>Historial</span></a>
          <a href="#/ajustes" data-ruta="ajustes"><svg class="ico"><use href="#i-ajustes"/></svg><span>Ajustes</span></a>
        </nav>
        <div class="estado-guardado" id="estado-guardado" aria-live="polite"></div>
      </div>
    </header>
    <div class="aviso-prueba" id="aviso-prueba" hidden>
      Modo prueba: los datos son de ejemplo y quedan solo en este equipo.
      <a href="#/ajustes">Salir del modo prueba</a>
    </div>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="cargando" class="cargando"><div class="cargando-sol"></div></div>

  <dialog id="dialogo" class="dialogo"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Firebase (misma versión que el sitio) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script type="module" src="js/app.js?v=1"></script>
</body>
</html>
